<text x="70" y="792" fill="#e8b23a" font-size="11.5">3. Tool rack â€” grab prying tool (pass sealed exit) — [OBJ: Inspect the seals on the Bio-Crates in the center aisle.]</text>
<text x="70" y="810" fill="#ff3b30" font-size="11.5">4. Bio-crates â€” the crisis — [OBJ: EMERGENCY: Containment breach! Check the security module crawl grate.]</text>
<text x="70" y="828" fill="#e8b23a" font-size="11.5">5. Lockdown â€” pry the grate (sec door badge-locked) — [OBJ: Pry the crawl grate and breach the Security Booth.]</text>
<text x="70" y="846" fill="#ff3b30" font-size="11.5">6. Guard â€” badge + pistol (scripts Pete) — [OBJ: Armed up! Return through the booth and prepare for combat.]</text>
<text x="70" y="864" fill="#ff3b30" font-size="11.5">7. Seared breach + fight in the aisles — [OBJ: Eliminate the Seared threat. Proceed to the Sealed Exit.]</text>
<text x="70" y="882" fill="#e8b23a" font-size="11.5">8. Badge kills maglock â€” pry the dead exit — [OBJ: Sector 1 Cleared. Enter the Central Elevator Shaft (Descend to Floor 2).]</text>
